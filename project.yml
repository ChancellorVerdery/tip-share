name: TipShare
options:
  bundleIdPrefix: org.thuban
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TipShareCore:
    path: Packages/TipShareCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TipShare:
    type: application
    platform: iOS
    sources:
      - path: TipShare
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: TipShareCore
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: TipShare/Resources/Info.plist
      properties:
        CFBundleName: Tip Share
        CFBundleDisplayName: Tip Share
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thuban.tipshare
        PRODUCT_NAME: Tip Share
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
